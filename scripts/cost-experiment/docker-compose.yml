# Is a small machine plus object storage cheaper than a database server?
#
# Three services, so the same workload can be run against three shapes:
#
#   postgres  a plain PostgreSQL with the whole table on its volume - what you
#             rent from a managed provider
#   dbcenter  DBCenter with a full local copy, so it is PostgreSQL plus a
#             columnar view of the same data in object storage
#   lazy      DBCenter restored from the deltas only: the history stays in the
#             bucket and is read from there
#
# The two DBCenter nodes share one bucket and are never up at the same time as
# each other, so the numbers are not measuring them competing for the disk.
#
#   docker compose -f scripts/cost-experiment/docker-compose.yml up -d storage storage-init
#   python scripts/cost-experiment/run.py

name: dbcenter-cost

services:
  storage:
    # minio/minio is no longer on Docker Hub. Bitnami's archived build is
    # frozen, which is fine for a benchmark, and creates the bucket itself.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: dbcenter
      MINIO_ROOT_PASSWORD: dbcenter123
      MINIO_DEFAULT_BUCKETS: events
    ports:
      - "29000:9000"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      # Ready means the bucket exists: an anonymous request is refused (403)
      # once it does and answers 404 until then.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/events/ | grep -q 403"]
      interval: 3s
      timeout: 2s
      retries: 40

  # Object storage that is a network away, which is what it is in production.
  #
  # MinIO next door answers in about a tenth of a millisecond; R2 or Tigris from
  # a Fly machine is tens of milliseconds, and that difference lands on every
  # read the local tables cannot answer. This shares the storage container's
  # network namespace and puts a netem delay on its interface, so every packet
  # in both directions is held - LATENCY_MS each way, twice that per round trip.
  #
  #   LATENCY_MS=10 docker compose --profile latency up -d latency
  latency:
    image: debian:bookworm-slim
    network_mode: "service:storage"
    cap_add: ["NET_ADMIN"]
    depends_on:
      storage:
        condition: service_healthy
    command: >
      sh -c "apt-get update -qq && apt-get install -y -qq iproute2 >/dev/null &&
             tc qdisc replace dev eth0 root netem delay ${LATENCY_MS:-0}ms &&
             tc qdisc show dev eth0"
    profiles: ["latency"]

  # The bucket is created by the storage service itself now; this only stands
  # for "storage is ready", so the nodes and run.py have one thing to wait on.
  storage-init:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ["sh", "-c", "echo bucket ready"]

  # A managed PostgreSQL, sized like the machine next to it.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: dbcenter123
      POSTGRES_DB: postgres
    # Fly's shared-cpu-1x with 1GB, which is the cheapest tier that can hold a
    # working set at all.
    cpus: 1.0
    mem_limit: 1g
    shm_size: 256m
    ports:
      - "25432:5432"
    volumes:
      # PostgreSQL 18's image wants the whole directory, not the data
      # subdirectory: it keeps the cluster in a version-named folder under it.
      - pg-data:/var/lib/postgresql

  dbcenter: &node
    image: dbcenter:bench
    depends_on:
      storage-init:
        condition: service_completed_successfully
    cpus: 1.0
    mem_limit: 1g
    environment: &node-env
      DBCENTER_STORAGE: s3
      DBCENTER_BUCKET: events
      DBCENTER_PREFIX: bench
      AWS_ENDPOINT_URL_S3: http://storage:9000
      AWS_ACCESS_KEY_ID: dbcenter
      AWS_SECRET_ACCESS_KEY: dbcenter123
      AWS_REGION: us-east-1
      AWS_S3_FORCE_PATH_STYLE: "true"
      DBCENTER_PASSWORD: dbcenter123
      DBCENTER_COLLECTIONS: events
      # Without this every field would land in the `data` JSONB column, because
      # a client on the wire protocol cannot evolve a collection's schema. The
      # Parquet would then be one JSON string per row and the columnar view
      # would have nothing to be fast about.
      DBCENTER_SCHEMA: >-
        {"events":{"user_id":"int","region":"text","amount":"float",
                   "ts_epoch":"int","payload":"text"}}
      DBCENTER_COLUMNAR: "true"
      # One pass must not try to hold the whole table in memory at once.
      DBCENTER_SYNC_BATCH: "500000"
      DBCENTER_SYNC_INTERVAL_SECS: "10"
      DBCENTER_COMPACT_INTERVAL_SECS: "60"
      DBCENTER_PULL: "false"
      RUST_LOG: info
    ports:
      - "25433:5432"
    volumes:
      - dbcenter-data:/data

  # The same image, restored from the deltas only.
  lazy:
    <<: *node
    environment:
      <<: *node-env
      DBCENTER_LAZY_RESTORE: "true"
      DBCENTER_NODE_ID: lazy
    ports:
      - "25434:5432"
    volumes:
      - lazy-data:/data

  # Read-only nodes against the same bucket, for the scaling question: does
  # adding a machine add read throughput, the way adding a PostgreSQL replica
  # would - but without giving each one a copy of the table?
  #
  # They restore from the deltas only and never push or compact. Each gets one
  # core, so three of them is the same compute as one three-core PostgreSQL and
  # the comparison is about shape rather than hardware.
  reader1: &reader
    image: dbcenter:bench
    depends_on:
      storage-init:
        condition: service_completed_successfully
    cpus: 1.0
    mem_limit: 1g
    environment: &reader-env
      DBCENTER_STORAGE: s3
      DBCENTER_BUCKET: events
      DBCENTER_PREFIX: bench
      AWS_ENDPOINT_URL_S3: http://storage:9000
      AWS_ACCESS_KEY_ID: dbcenter
      AWS_SECRET_ACCESS_KEY: dbcenter123
      AWS_REGION: us-east-1
      AWS_S3_FORCE_PATH_STYLE: "true"
      DBCENTER_PASSWORD: dbcenter123
      DBCENTER_COLLECTIONS: events
      DBCENTER_SCHEMA: >-
        {"events":{"user_id":"int","region":"text","amount":"float",
                   "ts_epoch":"int","payload":"text"}}
      DBCENTER_COLUMNAR: "true"
      DBCENTER_LAZY_RESTORE: "true"
      DBCENTER_COMPACT_INTERVAL_SECS: "0"
      DBCENTER_SYNC_INTERVAL_SECS: "3600"
      DBCENTER_PULL: "false"
      RUST_LOG: warn
    ports:
      - "25441:5432"
    profiles: ["readers"]

  reader2:
    <<: *reader
    environment:
      <<: *reader-env
      DBCENTER_NODE_ID: reader2
    ports:
      - "25442:5432"
    profiles: ["readers"]

  reader3:
    <<: *reader
    environment:
      <<: *reader-env
      DBCENTER_NODE_ID: reader3
    ports:
      - "25443:5432"
    profiles: ["readers"]

  # The same total compute in one PostgreSQL, which is how you would answer a
  # read load without replicas: buy a bigger machine.
  postgres-big:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: dbcenter123
    cpus: 3.0
    mem_limit: 1g
    shm_size: 256m
    ports:
      - "25444:5432"
    volumes:
      - pgbig-data:/var/lib/postgresql
    profiles: ["readers"]

volumes:
  pgbig-data:
  minio-data:
  pg-data:
  dbcenter-data:
  lazy-data:
