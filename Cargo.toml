[workspace]
members = [
    "dbcenter-core",
    "dbcenter-ffi",
    "dbcenter-python",
    "dbcenter-watcher",
    "dbcenter-node",
    "dbcenter-java",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DB Architect <arch@db.center>"]
license = "MIT"
repository = "https://github.com/heyobi/dbcenter"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "blocking", "stream", "json", "multipart"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "=0.4.38"

# PostgreSQL
postgres = { version = "0.19", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
parquet = { version = "53.0.0", features = ["arrow"] }
arrow = { version = "53.0.0", features = ["json"] } 
bytes = "1.0" 


# System
dirs = "5.0"
tempfile = "3.8"
zip = "2.1"
tar = "0.4"
flate2 = "1.0"
xz2 = { version = "0.1", features = ["static"] }
walkdir = "2.4"

# FFI
libc = "0.2"

# Python bindings
# Python bindings
pyo3 = { version = "0.23.5", features = ["extension-module", "serde", "abi3-py38"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
indicatif = "0.17"

# Testing
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
