[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "dbcenter"
version = "0.4.3"
description = "A real PostgreSQL in one pip install, for apps, notebooks, tests and AI agents: read-only SQL, an MCP server, pgvector, and sync to your own S3/R2 bucket"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "İbrahim Polat", email = "ipolat2001@gmail.com" }]
keywords = ["postgresql", "postgres", "embedded", "database", "pytest", "mcp", "ai-agents", "llm", "pgvector", "postgis", "s3", "parquet", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Framework :: Pytest",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/heyobi/dbcenter"
Source = "https://github.com/heyobi/dbcenter"
"Extension builds" = "https://github.com/heyobi/dbcenter-extensions"

[project.optional-dependencies]
dev = ["pytest", "pandas"]
# The MCP server, for language-model clients. mcp itself needs Python 3.10.
mcp = ["mcp>=2,<3"]

[project.scripts]
dbcenter-mcp = "dbcenter.mcp_server:main"

# pytest loads these fixtures by itself once dbcenter is installed:
# dbcenter_db, postgres_dsn, postgres_url. See dbcenter/testing.py.
[project.entry-points.pytest11]
dbcenter = "dbcenter.testing"

[tool.maturin]
# Mixed layout: the native module is dbcenter.dbcenter, and python/dbcenter
# holds the pure-Python parts (the MCP server) beside it. __init__.py re-exports
# the native module, so `import dbcenter` is unchanged.
python-source = "python"
module-name = "dbcenter.dbcenter"
