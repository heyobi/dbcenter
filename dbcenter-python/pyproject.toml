[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "dbcenter"
version = "0.4.0"
description = "Embedded PostgreSQL with a MongoDB-style API, PostGIS and pgvector included"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "İbrahim Polat", email = "ipolat2001@gmail.com" }]
keywords = ["postgresql", "postgres", "embedded", "database", "postgis", "pgvector", "gis", "vector"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://db.center"
Source = "https://github.com/heyobi/dbcenter"
"Extension builds" = "https://github.com/heyobi/dbcenter-extensions"

[project.optional-dependencies]
dev = ["pytest", "pandas"]
# The MCP server, for language-model clients. mcp itself needs Python 3.10.
mcp = ["mcp>=2,<3"]

[project.scripts]
dbcenter-mcp = "dbcenter.mcp_server:main"

[tool.maturin]
# Mixed layout: the native module is dbcenter.dbcenter, and python/dbcenter
# holds the pure-Python parts (the MCP server) beside it. __init__.py re-exports
# the native module, so `import dbcenter` is unchanged.
python-source = "python"
module-name = "dbcenter.dbcenter"
