[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "dbcenter"
version = "0.1.0"
description = "Embedded PostgreSQL with MongoDB-style API - Rust Edition"
authors = [{name = "DB Architect", email = "arch@db.center"}]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = ["pytest", "pandas"]

[tool.maturin]
module-name = "dbcenter"
