name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The embedded PostgreSQL distribution is downloaded from Maven Central on
      # first use and cached under ~/.dbcenter, so cache it alongside cargo.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.dbcenter
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      # Every crate in the workspace must keep compiling. The Java and Node
      # bindings drifted out of sync with DBCenter::new once already because
      # nothing built them.
      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p dbcenter-core -p dbcenter-serve -- -D warnings

      # Integration tests boot a real embedded PostgreSQL, so keep them serial.
      - name: Test
        run: cargo test -p dbcenter-core -p dbcenter-serve -- --test-threads=1

      # The S3 adapter's tests skip themselves without an endpoint, which would
      # quietly mean they never run. Give them one.
      - name: Object storage
        if: runner.os == 'Linux'
        # minio/minio is no longer on Docker Hub, so pulling it fails the job.
        # Bitnami's archived build is frozen, which is fine for a test server,
        # and creates the bucket itself.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=dbcenter -e MINIO_ROOT_PASSWORD=dbcenter123 \
            -e MINIO_DEFAULT_BUCKETS=dbcenter-test \
            bitnamilegacy/minio:2025.7.23-debian-12-r5
          # Ready means the bucket exists, not only the server: an anonymous
          # request is refused (403) once it does and answers 404 until then.
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/dbcenter-test/ || true)
            [ "$code" = 403 ] && exit 0
            sleep 2
          done
          docker logs minio
          echo "MinIO or its bucket did not become ready (last answer: $code)" >&2
          exit 1

      - name: Test object storage
        if: runner.os == 'Linux'
        env:
          DBCENTER_S3_TEST_ENDPOINT: http://127.0.0.1:9000
          DBCENTER_S3_TEST_BUCKET: dbcenter-test
          DBCENTER_S3_TEST_KEY: dbcenter
          DBCENTER_S3_TEST_SECRET: dbcenter123
        run: cargo test -p dbcenter-core --test s3_storage

      # The release build inside the image no longer fits beside the debug
      # build the tests left behind: "No space left on device". The runner
      # ships SDKs this project never uses; removing them frees about 20 GB.
      - name: Free disk for the image build
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Container image
        if: runner.os == 'Linux'
        run: docker build -t dbcenter:ci .

  # The Python bindings are the supported ones, so they get tested rather than
  # only built. Everything here boots a real embedded PostgreSQL.
  python:
    name: Python bindings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.dbcenter
            target
          key: python-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: python-cargo-

      - name: Build the extension module
        run: |
          python -m venv .venv
          # mcp so test_mcp.py runs rather than skipping; it is the optional
          # extra that provides the MCP server. pytest for the fixtures in
          # dbcenter.testing, which test_pytest_plugin.py runs through pytest.
          .venv/bin/pip install --quiet maturin "mcp>=2,<3" pytest
          .venv/bin/maturin develop --manifest-path dbcenter-python/Cargo.toml
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv

      # test_s3.py skips itself without an endpoint, which would quietly mean
      # the S3 adapter is never exercised from Python. Same server as the Rust
      # job's.
      - name: Object storage
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=dbcenter -e MINIO_ROOT_PASSWORD=dbcenter123 \
            -e MINIO_DEFAULT_BUCKETS=dbcenter-test \
            bitnamilegacy/minio:2025.7.23-debian-12-r5
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/dbcenter-test/ || true)
            [ "$code" = 403 ] && exit 0
            sleep 2
          done
          docker logs minio
          echo "MinIO or its bucket did not become ready (last answer: $code)" >&2
          exit 1

      # Serial: each test class starts its own server.
      - name: Test
        working-directory: python_tests
        env:
          DBCENTER_S3_TEST_ENDPOINT: http://127.0.0.1:9000
          DBCENTER_S3_TEST_BUCKET: dbcenter-test
        run: ../.venv/bin/python -m unittest discover -v -p 'test_*.py'
